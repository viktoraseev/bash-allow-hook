[package]
name = "bash-allow-hook"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Claude Code PreToolUse hook that approves Bash loops, branches, heredocs and assignments built only from allowed commands"
repository = "https://github.com/viktoraseev/bash-allow-hook"

[dependencies]
serde_json = "1.0.154"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
